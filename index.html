<style>

    radial-gradient(circle at 50% 120%, rgba(155,124,246,.06) 0%, transparent 45%),

html.light{
  --bg:#F5F2E9; --surface:#FFFFFF; --surface-2:#F1EEE2; --surface-3:#E8E3D2; --border:#E1DBC8;
  --border-soft:rgba(20,15,5,.06);

  --cyan:#1591A3; --cyan-dim:#DEF3F5;
  --gray:#B7AF9D; --shadow:0 10px 28px -8px rgba(80,60,20,.14), 0 2px 8px rgba(80,60,20,.08);
  --shadow-sm:0 3px 10px rgba(80,60,20,.08);
  --glow-amber:0 0 0 1px rgba(185,121,31,.25), 0 0 18px -5px rgba(185,121,31,.35);
  --bg-image:radial-gradient(circle at 10% -4%, #FBF3DC 0%, transparent 42%),radial-gradient(circle at 100% 4%, #E8F4F2 0%, transparent 40%),var(--bg);
}

html,body{margin:0;padding:0;background:var(--bg-image);background-attachment:fixed;color:var(--text);font-family:var(--body);height:100%;font-size:16.5px;-webkit-font-smoothing:antialiased;}
body{position:relative;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;

#app{min-height:100vh;display:flex;flex-direction:column;position:relative;z-index:1;}
::selection{background:var(--amber);color:#241a06;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
::-webkit-scrollbar-thumb:hover{background:var(--amber-dim);}
a{color:var(--amber);}
h1,h2,h3{font-family:var(--display);margin:0 0 8px;letter-spacing:.01em;}
h2{font-size:22px;} h3{font-size:18px;}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:6px;}
button{font-family:var(--body);cursor:pointer;border:none;border-radius:12px;padding:13px 20px;font-weight:600;font-size:15.5px;transition:transform .16s var(--ease), opacity .15s, box-shadow .2s, background .2s, border-color .2s;min-height:46px;position:relative;}
button:active{transform:scale(.96);}
button.primary{background:linear-gradient(135deg,var(--amber),var(--amber-2));color:#241a06;box-shadow:0 3px 14px rgba(239,165,62,.32);}
button.primary:hover{box-shadow:0 6px 20px rgba(239,165,62,.48);transform:translateY(-1px);}

button.ghost{background:transparent;color:var(--text);border:1px solid var(--border);}
button.ghost:hover{border-color:var(--amber);color:var(--amber);}
button.danger{background:linear-gradient(135deg,var(--red),#c93840);color:#fff;box-shadow:0 3px 12px rgba(229,72,77,.28);}

button.subtle:hover{background:var(--surface-3);}
button:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;transform:none;}
button.iconbtn{padding:8px 12px;font-size:16px;min-height:auto;border-radius:10px;}
input,select,textarea{font-family:var(--body);background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:13px 14px;border-radius:10px;font-size:16px;width:100%;min-height:46px;transition:border-color .15s, box-shadow .15s;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(239,165,62,.15);}
label{font-size:12.5px;color:var(--text-dim);display:block;margin:11px 0 5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--border-soft);position:sticky;top:0;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(10px);z-index:50;box-shadow:var(--shadow-sm);}

.container{max-width:960px;margin:0 auto;padding:24px 18px 90px;width:100%;flex:1;}

.badge.active{background:#123822;color:var(--green);box-shadow:inset 0 0 0 1px rgba(48,184,122,.35);}

.tab:hover{color:var(--text);}
.tab.on{color:var(--amber);border-color:var(--amber);}
.crumbs{font-size:13px;color:var(--text-dim);margin-bottom:12px;}
.crumbs span{cursor:pointer;color:var(--amber);}
.crumbs span:hover{text-decoration:underline;}
.qrow{display:flex;justify-content:space-between;align-items:center;padding:16px;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:background .18s, transform .16s var(--ease), border-color .18s, box-shadow .18s;animation:riseIn .34s var(--ease) both;}
.qrow:hover{background:var(--amber-dim);border-color:var(--amber);transform:translateX(3px);box-shadow:var(--shadow-sm);}
.lockicon{opacity:.6;font-size:15px;}
.exam-shell{display:grid;grid-template-columns:1fr 260px;gap:0;flex:1;}
@media(max-width:760px){.exam-shell{grid-template-columns:1fr;}}
.exam-main{padding:20px;overflow-y:auto;}
.exam-side{background:var(--surface);border-left:1px solid var(--border-soft);padding:16px;}
.timer-ring{display:inline-flex;padding:3px;border-radius:14px;background:conic-gradient(var(--amber) calc(var(--pct,100)*1%), var(--border) 0);transition:background .5s linear;}
.timer-ring.low{background:conic-gradient(var(--red) calc(var(--pct,100)*1%), var(--border) 0);animation:timerLowPulse 1s ease-in-out infinite;}
@keyframes timerLowPulse{0%,100%{filter:brightness(1);}50%{filter:brightness(1.35);}}
.timer{font-family:var(--mono);font-size:27px;font-weight:600;color:var(--amber);letter-spacing:.03em;background:var(--amber-dim);padding:8px 14px;border-radius:11px;display:inline-block;}
.timer-ring.low .timer{color:var(--red);}
.opt{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;font-size:18px;line-height:1.5;transition:border-color .18s, background .18s, transform .16s var(--ease);animation:riseIn .3s var(--ease) both;}
.opt:nth-of-type(1){animation-delay:0ms;} .opt:nth-of-type(2){animation-delay:40ms;} .opt:nth-of-type(3){animation-delay:80ms;} .opt:nth-of-type(4){animation-delay:120ms;} .opt:nth-of-type(5){animation-delay:160ms;}
.opt:hover{border-color:var(--amber);transform:translateX(2px);}
.opt.sel{border-color:var(--amber);background:var(--amber-dim);box-shadow:var(--glow-amber);}
.opt.correct{border-color:var(--green);background:#0f2a1c;box-shadow:0 0 0 1px rgba(48,184,122,.3), 0 0 18px -6px rgba(48,184,122,.5);}
.opt.wrong{border-color:var(--red);background:#2a1113;box-shadow:0 0 0 1px rgba(240,82,90,.3), 0 0 18px -6px rgba(240,82,90,.5);}
.palette{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:12px;}
.pnum{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;font-weight:700;cursor:pointer;border:2px solid transparent;color:#0B1220;min-height:28px;max-width:34px;transition:transform .15s var(--ease), filter .15s;}
.pnum:hover{transform:scale(1.1);filter:brightness(1.1);}
.pnum.not_visited{background:var(--gray);}
.pnum.not_answered{background:var(--red);color:#fff;}
.pnum.answered{background:var(--green);color:#fff;}
.pnum.marked{background:var(--purple);color:#fff;}
.pnum.answered_marked{background:var(--purple);color:#fff;box-shadow:inset 0 0 0 3px var(--green);}
.pnum.current{border-color:var(--amber);box-shadow:0 0 0 3px rgba(239,165,62,.25);}
.legend{display:flex;flex-direction:column;gap:5px;font-size:11px;margin-top:14px;color:var(--text-dim);}
.legend span{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle;}

th{color:var(--text-dim);font-weight:600;font-size:12px;text-transform:uppercase;}

.spinner{width:26px;height:26px;border:3px solid var(--border);border-top-color:var(--amber);border-right-color:var(--amber-2);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}

.qmeta{font-family:var(--mono);font-size:13px;color:var(--text-dim);margin-bottom:6px;}

.donut{--pct:0;width:112px;height:112px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--amber) calc(var(--pct)*1%), var(--surface-3) 0);box-shadow:var(--shadow-sm);position:relative;}

.diffbar-count{font-family:var(--display);font-weight:700;font-size:16px;color:var(--text);}

.filepick{border:1px dashed var(--border);border-radius:10px;padding:14px;margin-top:6px;transition:border-color .18s;}
.filepick:hover{border-color:var(--amber);}
.themebtn{background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:9px 12px;font-size:17px;min-height:auto;line-height:1;transition:transform .2s var(--ease), border-color .2s;}

.ranktbl{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px;}
.ranktbl th,.ranktbl td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:left;}

@media print{
  body *{visibility:hidden;}
  #printArea, #printArea *{visibility:visible;}
  #printArea{position:absolute;left:0;top:0;width:100%;}

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZqcWhneGpuemp4cXZyYWxjdnFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NjQ1NjQsImV4cCI6MjA5OTM0MDU2NH0.KnYldvE-fH9Rbc5Px3tZ6BjQLhcMDI-Vmg6QX9XPILk';

const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
// Supabase/PostgREST silently caps any .select() with no .range() at ~1000
// rows — a qbank like Marrow with 3,599 sections (or a folder with 2,000+
// questions) would come back truncated with NO error, just fewer rows than
// actually exist. This pages through in batches of 1000 until exhausted,
// so anywhere that needs a genuinely complete list uses this instead of a
// bare .select().
async function fetchAllRows(buildQuery){
  let all = [], from = 0; const PAGE = 1000;
  while(true){
    const { data, error } = await buildQuery().range(from, from+PAGE-1);
    if(error) throw error;
    all = all.concat(data||[]);
    if(!data || data.length < PAGE) break;
    from += PAGE;
  }
  return all;
}
const app = document.getElementById('app');

const CATS = [
  {key:'guess_work', label:'Guess work'},
  {key:'fact_unknown', label:'Fact unknown'},
  {key:'concept_unknown', label:'Concept unknown'},
  {key:'silly_mistake', label:'Silly mistake'},
];
// Groups a folder's name into a coarse bucket for filtering/browsing:
// "Anatomy - Abdomen & Pelvis" -> "Anatomy" (splits on " - ");
// "GT1", "PYQ 2023", "INICET Set 3" -> "GT" / "PYQ" / "INICET" (leading
// non-numeric word). Used by the Sections nav filter, the admin checklist,
// and the custom-test builder's Subject-wise/PYQ/GT source picker.
// One round trip for question counts across many folders at once (fetching
// only the folder_id column keeps the payload small), instead of firing a
// separate count query per folder — that N-query fan-out was the main
// source of lag when opening a platform/category on a slower connection.
async function countsByFolder(folderIds){
  const map = {};
  if(!folderIds || !folderIds.length) return map;
  const { data } = await sb.from('questions').select('folder_id').in('folder_id', folderIds);
  (data||[]).forEach(r=>{ map[r.folder_id] = (map[r.folder_id]||0) + 1; });
  return map;
}
function folderGroupOf(name){
  if(name.includes(' - ')) return name.split(' - ')[0].trim();
  const m = name.match(/^[^\d]+/);
  return (m ? m[0] : name).trim() || name;
}
// 3-level naming support: "Folder - Subfolder - Topic" (e.g. "Tests -
// Subject Test - Anatomy") lets an admin define their own custom top-level
// folder (shown as the big category card) with their own named subfolders
// inside it (shown in the dropdown one level down), instead of relying on
// the auto-detected 5-bucket category further below. Folder names with only
// 1-2 " - " segments keep the old auto-detected behaviour untouched, so
// nothing already uploaded changes.
function nameParts(name){ return String(name||'').split(' - ').map(s=>s.trim()).filter(Boolean); }
function subGroupOf(name){ const p = nameParts(name); return p.length>=3 ? p[1] : folderGroupOf(name); }
function leafNameOf(name){ const p = nameParts(name); if(p.length>=3) return p.slice(2).join(' - '); if(p.length===2) return p[1]; return name; }
// Plain alphabetical sort puts "GT 10" before "GT 2" (string comparison
// compares character-by-character, so '1' < '2' regardless of what follows).
// This compares embedded number runs as actual numbers instead, so a list
// like GT1, GT2, GT14, GT30 comes out in true numeric/serial order rather
// than GT1, GT14, GT2, GT30.
function naturalCompare(a, b){
  const ax = String(a||'').match(/\d+|\D+/g) || [];
  const bx = String(b||'').match(/\d+|\D+/g) || [];
  const len = Math.max(ax.length, bx.length);
  for(let i=0;i<len;i++){
    const av = ax[i], bv = bx[i];
    if(av===undefined) return -1;
    if(bv===undefined) return 1;
    const an = /^\d+$/.test(av), bn = /^\d+$/.test(bv);
    if(an && bn){
      const diff = parseInt(av,10) - parseInt(bv,10);
      if(diff) return diff;
    } else {
      const cmp = av.localeCompare(bv);
      if(cmp) return cmp;
    }
  }
  return 0;
}

  inicet:       {label:'INICET pattern',        perSet:50, minutesPerFull:45, sequential:true},

// The 19 NEET PG subjects, each with common short/long-form aliases used by
// providers like BTR/Prepladder. A file/folder name is matched against these
// (whole-word, case-insensitive) to auto-detect that it's a subject file.
const SUBJECT_ALIASES = {
  'Anatomy':                    ['anatomy','anat'],
  'Physiology':                 ['physiology','physio','phys'],
  'Biochemistry':                ['biochemistry','biochem','bioc'],
  'Pathology':                   ['pathology','patho','path'],
  'Pharmacology':                ['pharmacology','pharma','pharm'],
  'Microbiology':                ['microbiology','micro'],
  'Forensic Medicine':           ['forensicmedicine','forensic','fmt'],
  'Community Medicine (PSM)':    ['communitymedicine','psm','sm','pmr'],
  'ENT':                         ['ent','otorhinolaryngology'],
  'Ophthalmology':               ['ophthalmology','ophthal','opth','eye'],
  'Medicine':                    ['medicine','generalmedicine','gm','im'],
  'Surgery':                     ['surgery','generalsurgery','gs'],
  'Pediatrics':                  ['pediatrics','paediatrics','peds','pedia'],
  'Obstetrics & Gynaecology':    ['obg','obstetrics','gynaecology','gynecology','gynae','og'],
  'Orthopedics':                 ['orthopedics','orthopaedics','ortho'],
  'Radiology':                   ['radiology','radiodiagnosis','radio'],
  'Anesthesia':                  ['anesthesia','anaesthesia','anaesthesiology','anesthesiology'],
  'Psychiatry':                  ['psychiatry','psych'],
  'Dermatology':                 ['dermatology','derma','dvl','skin'],
};
function detectSubject(name){
  const tokens = String(name||'').toLowerCase().replace(/\.(json|ndjson|txt)$/,'').split(/[^a-z0-9]+/).filter(Boolean);
  for(const tok of tokens){
    for(const subj in SUBJECT_ALIASES){
      if(SUBJECT_ALIASES[subj].includes(tok)) return subj;
    }
  }
  return null;
}
// Decides the exam pattern for an uploaded file purely from its name:
// - matches one of the 19 subjects (short or full form) -> subject-wise
//   (50 q / 45 min sets, last partial set gets 0.9 min/question)
// - anything else (gt1, gt2, neetpg, inicet, ...) -> auto_subsection
//   (50 q / 45 min sequential subsections inside one section, can't reopen
//   a submitted/expired subsection)
function autoDetectExamType(name){
  const subject = detectSubject(name);
  if(subject) return { type:'subjectwise', subject };
  return { type:'auto_subsection', subject:null };
}
// Detects which "platform" (qbank) a file belongs to from its name, e.g.
// "Prepladder_GT1.json" or "BTR Anatomy.json". Add more aliases here as
// you bring in more source platforms.
const PLATFORM_ALIASES = {
  'BTR': ['btr'],
  'Prepladder': ['prepladder'],
  'Marrow': ['marrow'],
  'Doc Tutorial': ['doctutorial','doctutorials','doctut'],
  'DAMS': ['dams'],
};
function detectPlatformName(name){
  const lower = String(name||'').toLowerCase().replace(/\.(json|ndjson|txt)$/,'');
  const tokens = lower.split(/[^a-z0-9]+/).filter(Boolean);
  const squashed = tokens.join(''); // handles multi-word platform names like "Doc Tutorial" -> "doctutorial"
  for(const platform in PLATFORM_ALIASES){
    if(PLATFORM_ALIASES[platform].some(a=>tokens.includes(a) || squashed.includes(a))) return platform;
  }
  return null;
}

// ---------- category grouping (Subject-wise / Tests / GT / NEET PG / INICET) ----------
// Buckets a folder into one of the 5 top-level categories the user browses
// by, computed purely from data already on hand (folder name + exam_type) —
// no extra Supabase query needed. Order here also drives display order.
const CATEGORY_ORDER = ['Subjectwise Qbank','Tests','Grand Tests (GT)','NEET PG','INICET','FMGE','Other'];
function categoryOf(f){
  const p = nameParts(f.name);
  if(p.length>=2) return p[0]; // explicit admin/pipeline-chosen top folder always wins
  if(f.exam_type==='subjectwise') return 'Subjectwise Qbank';
  const g = folderGroupOf(f.name).toLowerCase();
  if(f.exam_type==='inicet' || g.startsWith('inicet')) return 'INICET';
  if(f.exam_type==='neetpg' || f.exam_type==='updated_neetpg' || g.startsWith('neetpg') || g.startsWith('neet pg') || g.startsWith('neet')) return 'NEET PG';
  if(f.exam_type==='fmge' || g.startsWith('fmge')) return 'FMGE';
  if(g.startsWith('gt')) return 'Grand Tests (GT)';
  if(g.startsWith('pyq') || g.includes('test')) return 'Tests';
  return 'Other';
}

// ---------- in-app back navigation ----------
// The app never changes the URL, so by default the phone's/browser's back
// button (or back gesture) has nothing to "undo" and just closes the app.
// To fix that, every time the user moves to a deeper/different screen we
// push one browser-history entry and remember a snapshot of where they
// were. A hardware/gesture back then fires `popstate`, which we catch here
// to restore that snapshot instead of letting the OS close the app. Only
// once our own stack is empty (i.e. we're back at the very first screen)
// does back behave like normal browser/app-exit back.
let navStack = [];
// Every navigation bumps this. Tab-loading functions are async (they await
// Supabase queries) — if the user navigates again before one finishes, its
// `.innerHTML +=` would land on top of whatever the *new* screen already
// rendered, since it's still writing to the same #utabBody by id. Each
// loader grabs its own token at the start and checks it's still current
// right before writing to the DOM; if not, a newer navigation has already
// taken over and it just quietly stops instead of appending stale content.
let navToken = 0;
function snapshotState(){
  return { view:S.view, utab:S.utab, atab:S.atab, nav:{...(S.nav||{})}, exam:S.exam||null, review:S.review||null };
}
// Wrap any navigation that should be "undo-able" with the back button:
// goTo({nav:{...}}) / goTo({utab:'stats'}) / goTo({view:'exam', exam:{...}}) etc.
function goTo(changes){
  navStack.push(snapshotState());
  history.pushState({d:navStack.length}, '');
  Object.assign(S, changes);
  render();
}
window.addEventListener('popstate', ()=>{
  // Leaving an in-progress exam via hardware back: stop the timer and flush
  // the latest answers, same as the explicit "← Back" button does.
  if(S.exam){
    clearInterval(timerHandle);
    clearTimeout(saveTimeout);
    sb.from('attempts').update({answers:S.exam.att.answers}).eq('id', S.exam.att.id);
  }
  if(navStack.length){
    const prev = navStack.pop();
    S.view=prev.view; S.utab=prev.utab; S.atab=prev.atab; S.nav=prev.nav||{}; S.exam=prev.exam||null; S.review=prev.review||null;
    render();
  } else if(S.exam || S.view==='exam'){
    // Nothing left on our stack, but we were mid-exam — land safely on the
    // dashboard rather than showing a broken exam screen.
    S.exam=null; S.view='user'; S.utab='qbanks'; S.nav={};
    render();
  }
  // else: our stack is empty and we're already on a top-level screen, so
  // there's nothing to intercept — let the platform's normal back happen.
});

function toast(msg){
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function getDeviceId(){
  let id = localStorage.getItem('qb_device_id');
  if(!id){ id = 'dev_'+Math.random().toString(36).slice(2)+Date.now().toString(36); localStorage.setItem('qb_device_id', id); }
  return id;
}
function fmtTime(sec){
  if(sec<0) sec=0;
  const h=Math.floor(sec/3600), m=Math.floor((sec%3600)/60), s=Math.floor(sec%60);
  return (h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}
function statusOf(a){ return a ? a.status : 'not_visited'; }
function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Rich text renderer: supports plain text, **bold**, line breaks, and
// pipe tables (for "match the following" / tabular questions). Input is
// escaped first, so this never introduces unsafe HTML.
// Applies **bold** and inline ![alt](url) image syntax. Image syntax works
// anywhere — question stem, each option, explanation text, and even inside
// "match the following" table cells — so any phase/pattern (subject-wise,
// GT, INICET, NEET PG) can carry an image wherever it's placed, just by
// including ![](https://your-image-url) in that field's text.
function inlineFmt(s){
  return s
    .replace(/!\[([^\]]*)\]\((\S+?)\)/g, '<img class="qimg" src="$2" alt="$1">')
    .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
}
function renderRichText(raw){
  if(!raw) return '';
  const escaped = escapeHtml(raw);
  const lines = escaped.split(/\n/);
  let html = '', tableBuf = [], inTable = false;
  const flushTable = ()=>{
    if(!tableBuf.length) return;
    const rows = tableBuf.filter(r=>!/^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(r));
    html += '<table class="rt">';
    rows.forEach((r,ri)=>{
      const cells = r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const tag = ri===0 ? 'th' : 'td';
      html += '<tr>' + cells.map(c=>`<${tag}>${inlineFmt(c)}</${tag}>`).join('') + '</tr>';
    });
    html += '</table>';
    tableBuf = [];
  };
  for(const line of lines){
    if(/^\s*\|.*\|\s*$/.test(line)){
      inTable = true; tableBuf.push(line); continue;
    } else if(inTable){
      flushTable(); inTable = false;
    }
    let l = inlineFmt(line);
    html += (html && !html.endsWith('</table>') ? '<br>' : '') + l;
  }
  if(inTable) flushTable();
  return html;
}
// Resolves a bare filename (e.g. "q1.png") referenced in the JSON against a
// map of {lowercased filename -> uploaded public URL}. Full http(s) URLs are
// left untouched, so existing JSON that already uses hosted image URLs keeps
// working exactly as before.
function resolveImageField(v, imageMap){
  if(!v) return v;
  if(/^https?:\/\//i.test(v)) return v;
  return (imageMap && imageMap[String(v).trim().toLowerCase()]) || v;
}
// Same idea but for inline ![alt](filename) refs inside rich text fields
// (question stem, options, explanation, table cells).
function resolveInlineImages(text, imageMap){
  if(!text) return text;
  return text.replace(/!\[([^\]]*)\]\((\S+?)\)/g, (m, alt, url)=>{
    if(/^https?:\/\//i.test(url)) return m;
    const resolved = imageMap && imageMap[url.trim().toLowerCase()];
    return resolved ? `![${alt}](${resolved})` : m;
  });
}
function richBlock(raw, imageUrl){
  let html = '';
  if(imageUrl) html += `<img class="qimg" src="${escapeHtml(imageUrl)}" alt="question image" loading="eager" fetchpriority="high" decoding="async">`;
  html += `<div>${renderRichText(raw)}</div>`;
  return html;
}

// ---------- boot ----------
async function boot(){
  S.deviceId = getDeviceId();
  const { data:{ session } } = await sb.auth.getSession();
  S.session = session;
  if(session){ await loadProfile(); }
  render();
  sb.auth.onAuthStateChange((event, sess)=>{
    // Any of these events can re-fire for the SAME already-signed-in user
    // whenever the tab regains focus — which happens the instant the native
    // file picker closes after choosing a file. Re-rendering in that case
    // wipes whatever screen (and file selection) was in progress and looks
    // like the page refreshed itself. So we only reload profile + re-render
    // when the signed-in user has actually changed (real sign-in/out),
    // never just because Supabase re-emitted an event for the same user.
    const prevUserId = S.session?.user?.id || null;
    const nextUserId = sess?.user?.id || null;
    S.session = sess;
    if(prevUserId === nextUserId) return; // same user (or same signed-out state) — no-op
    if(sess) loadProfile().then(render); else { S.profile=null; S.view='auth'; render(); }
  });
}
async function loadProfile(){
  const email = S.session.user.email;
  const isAdminEmail = email === ADMIN_EMAIL;
  let { data } = await sb.from('profiles').select('*').eq('id', S.session.user.id).maybeSingle();
  if(!data){
    const ins = await sb.from('profiles').upsert({
      id:S.session.user.id, email,
      role: isAdminEmail?'admin':'user',
      status: isAdminEmail?'active':'pending'
    }, {onConflict:'id'}).select().maybeSingle();
    data = ins.data;
  }
  if(isAdminEmail && data && (data.role!=='admin' || data.status!=='active')){
    const upd = await sb.from('profiles').update({role:'admin', status:'active'}).eq('id', S.session.user.id).select().maybeSingle();
    if(upd.data) data = upd.data;
  }
  S.profile = data;
  if(S.profile && S.profile.role!=='admin'){
    // Subscription expired since last login: flip them to revoked and kick
    // them out straight to the login screen instead of letting them sit on
    // a "locked" screen while still technically signed in.
    const expired = S.profile.status==='active' && S.profile.subscription_expiry && new Date(S.profile.subscription_expiry) <= new Date();
    if(expired){
      await sb.from('profiles').update({status:'revoked'}).eq('id', S.profile.id);
      S.authNotice = 'expired';
      await signOut();
      return;
    }
    await registerDevice();
    startExpiryWatcher();
  }
  S.view = S.profile?.role==='admin' ? 'admin' : 'user';
}
// Re-checks the logged-in user's own status/expiry every couple of minutes
// so an expiry that lands *during* an open session (or an admin
// revoking/deleting them while they're mid-session) also forces a sign-out,
// not just the check done at login.
let expiryWatcherHandle = null;
function startExpiryWatcher(){
  if(expiryWatcherHandle) return;
  expiryWatcherHandle = setInterval(async ()=>{
    if(!S.session || !S.profile || S.profile.role==='admin') return;
    const { data } = await sb.from('profiles').select('status, subscription_expiry').eq('id', S.profile.id).maybeSingle();
    if(!data){
      // Profile row is gone — admin deleted this account.
      clearInterval(expiryWatcherHandle); expiryWatcherHandle=null;
      S.authNotice = 'deleted';
      await signOut();
      return;
    }
    const expired = data.status==='active' && data.subscription_expiry && new Date(data.subscription_expiry) <= new Date();
    const revokedElsewhere = data.status==='revoked' && S.profile.status!=='revoked';
    if(expired || revokedElsewhere){
      if(expired) await sb.from('profiles').update({status:'revoked'}).eq('id', S.profile.id);
      clearInterval(expiryWatcherHandle); expiryWatcherHandle=null;
      S.authNotice = expired ? 'expired' : 'revoked';
      await signOut();
    }
  }, 120000);
}
async function registerDevice(){
  const { data: devices } = await sb.from('devices').select('*').eq('user_id', S.profile.id);
  const mine = (devices||[]).find(d=>d.device_id===S.deviceId);
  if(mine){
    await sb.from('devices').update({last_seen:new Date().toISOString()}).eq('id', mine.id);
    return;
  }
  const limit = S.profile.device_limit||1;
  if((devices||[]).length >= limit){
    S.deviceBlocked = true;
    return;
  }
  await sb.from('devices').insert({user_id:S.profile.id, device_id:S.deviceId});
}

  // because their account role is admin.

  return renderUser();
}

      if(!age){ errEl.textContent='Enter your age.'; return; }
      if(!batch){ errEl.textContent='Enter your batch.'; return; }
      if(!college){ errEl.textContent='Enter your college.'; return; }
      if(!avatarFile){ errEl.textContent='Upload a profile picture.'; return; }
      if(!idFile){ errEl.textContent='Upload your college ID.'; return; }
      btn.disabled = true; btn.textContent = 'Creating account…';
      const { error, data: suData } = await sb.auth.signUp({ email, password });
      if(error){ errEl.textContent=error.message; btn.disabled=false; btn.textContent='Create account'; return; }
      toast('Account created. Signing you in…');
      const { error: siErr } = await sb.auth.signInWithPassword({ email, password });
      if(siErr){ errEl.textContent=siErr.message; btn.disabled=false; btn.textContent='Create account'; return; }
      const { data:{ session } } = await sb.auth.getSession();
      S.session=session; await loadProfile();
      // Profile row now exists (loadProfile creates it) — fill in what the
      // signup form collected, uploading avatar/college-id if provided.
      const uid = session.user.id;
      const extra = { name, age: age?+age:null, batch, college };
      btn.textContent = 'Saving profile…';
      if(avatarFile){
        const ext = (avatarFile.name.split('.').pop()||'jpg').toLowerCase();
        const path = `${uid}/avatar.${ext}`;
        const up = await sb.storage.from('avatars').upload(path, avatarFile, {upsert:true, contentType: avatarFile.type||undefined});
        if(!up.error){ extra.avatar_url = sb.storage.from('avatars').getPublicUrl(path).data.publicUrl; }
      }
      if(idFile){
        const ext = (idFile.name.split('.').pop()||'jpg').toLowerCase();
        const path = `${uid}/college_id.${ext}`;
        const up = await sb.storage.from('college-ids').upload(path, idFile, {upsert:true, contentType: idFile.type||undefined});
        if(!up.error){ extra.college_id_path = path; }
      }
      await sb.from('profiles').update(extra).eq('id', uid);
      S.profile = { ...S.profile, ...extra };
      render();
      return;
    }
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email, password });
    if(error){ errEl.textContent=error.message; btn.disabled=false; return; }
    const { data:{ session } } = await sb.auth.getSession();
    S.session=session; await loadProfile(); render();
  };
}

// ---- QBank -> Category -> Folder -> Sets navigation ----
function crumbBar(items){
  // items: [{label, onClick}]
  return `<div class="crumbs">` + items.map((it,i)=>{
    const sep = i>0 ? ' / ' : '';
    return sep + (it.onClick ? `<span data-crumb="${i}">${it.label}</span>` : it.label);
  }).join('') + `</div>`;
}
async function loadQbanksNav(isActive){
  if(!S.nav.qbankId){ return loadQbankList(isActive); }
  if(!S.nav.category){ return loadCategoryList(isActive); }
  if(!S.nav.folderId){ return loadFolderList(isActive); }
  return loadFolderSets(isActive);
}
async function loadQbankList(isActive){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const { data: qbanks } = await sb.from('qbanks').select('*').order('created_at',{ascending:false});
  if(myToken !== navToken) return;
  if(!qbanks || !qbanks.length){ body.innerHTML += `<div class="card muted">No qbanks published yet.</div>`; return; }
  // Fire all section-count queries in parallel instead of one-by-one —
  // sequential awaits here were the main cause of the slow load.
  const counts = await Promise.all(qbanks.map(qb=>
    sb.from('folders').select('id', {count:'exact', head:true}).eq('qbank_id', qb.id)
  ));
  if(myToken !== navToken) return;
  let html = '<div class="grid">';
  qbanks.forEach((qb,i)=>{
    const count = counts[i].count;
    html += `<div class="card" style="cursor:pointer;" data-qb="${qb.id}"><h3>${qb.name}</h3><div class="muted">${count||0} sections</div></div>`;
  });
  html += '</div>';
  body.innerHTML += html;
  body.querySelectorAll('[data-qb]').forEach(el=>el.onclick=()=>{ goTo({nav:{qbankId: el.dataset.qb}}); });
}
// Level 2: shows the 5 top-level category cards (Subject-wise / Tests / GT /
// NEET PG / INICET) for this qbank. Deliberately fetches only id/name/exam_type
// for every folder (no count queries here) — grouping is done client-side for
// free. This is what removes the lag that used to happen when opening a
// platform with 200+ sections: previously every section's question-count was
// queried at once right here; now that only happens per-category (see
// loadFolderList), on a much smaller batch.
async function loadCategoryList(isActive){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const { data: qb } = await sb.from('qbanks').select('*').eq('id', S.nav.qbankId).maybeSingle();
  if(myToken !== navToken) return;
  body.innerHTML += crumbBar([{label:'QBanks', onClick:true},{label:qb?.name||'QBank'}]);
  const folders = await fetchAllRows(()=>sb.from('folders').select('id, name, exam_type').eq('qbank_id', S.nav.qbankId));
  if(myToken !== navToken) return;
  if(!folders || !folders.length){ document.getElementById('utabBody').innerHTML += `<div class="card muted">No sections in this qbank yet.</div>`; return; }
  const byCat = {};
  folders.forEach(f=>{ const c=categoryOf(f); (byCat[c]=byCat[c]||[]).push(f); });
  let html = '<div class="grid">';
  const orderedCats = CATEGORY_ORDER.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CATEGORY_ORDER.includes(c)));
  orderedCats.forEach(cat=>{
    html += `<div class="card" style="cursor:pointer;" data-cat="${cat}"><h3>${cat}</h3><div class="muted">${byCat[cat].length} section${byCat[cat].length===1?'':'s'}</div></div>`;
  });
  html += '</div>';
  if(myToken !== navToken) return;
  document.getElementById('utabBody').innerHTML += html;
  document.querySelectorAll('[data-cat]').forEach(el=>el.onclick=()=>{ goTo({nav:{...S.nav, category: el.dataset.cat}}); });
  const crumb = document.querySelector('[data-crumb="0"]');
  if(crumb) crumb.onclick = ()=>{ goTo({nav:{}}); };
}
async function loadFolderList(isActive){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const { data: qb } = await sb.from('qbanks').select('*').eq('id', S.nav.qbankId).maybeSingle();
  if(myToken !== navToken) return;
  body.innerHTML += crumbBar([{label:'QBanks', onClick:true},{label:qb?.name||'QBank', onClick:true},{label:S.nav.category}]);
  const allFolders = await fetchAllRows(()=>sb.from('folders').select('*').eq('qbank_id', S.nav.qbankId));
  if(myToken !== navToken) return;
  const folders = (allFolders||[]).filter(f=>categoryOf(f)===S.nav.category);
  folders.sort((a,b)=>naturalCompare(leafNameOf(a.name), leafNameOf(b.name)));

  // Within a category, folders can still be further grouped by name prefix
  // (e.g. inside "Subject-wise": "Anatomy - Abdomen", "Anatomy - Thorax" ->
  // "Anatomy"). Only shown if there's more than one group.
  function groupOf(name){ return subGroupOf(name); }
  const groups = [...new Set(folders.map(f=>groupOf(f.name)))].sort();

  function renderList(filterGroup, loading){
    if(myToken !== navToken) return;
    let html = '';
    if(groups.length>1){
      html += `<div class="row" style="margin-bottom:14px;">
        <select id="folderGroupSel" style="max-width:280px;">
          <option value="__all__">All in ${S.nav.category} (${folders.length})</option>
          ${groups.map(g=>{
            const n = folders.filter(f=>groupOf(f.name)===g).length;
            return `<option value="${g}" ${g===filterGroup?'selected':''}>${g} (${n})</option>`;
          }).join('')}
        </select>
      </div>`;
    }
    const visible = folders.filter(f=> filterGroup==='__all__' || groupOf(f.name)===filterGroup);
    if(!visible.length){
      html += `<div class="card muted">No sections in this group.</div>`;
    } else {
      visible.forEach(f=>{
        const rank = f._rank;
        const pct = rank && rank.user_total ? Math.round((rank.user_correct/rank.user_total)*1000)/10 : null;
        html += `<div class="qrow" data-folder="${f.id}" style="flex-direction:column;align-items:stretch;gap:5px;">
          <div class="row" style="justify-content:space-between;">
            <b>${leafNameOf(f.name)}</b>
          </div>
          <div class="muted" style="font-size:13px;">${loading ? 'loading details…' : `${f._setCount||0} subsection${f._setCount===1?'':'s'} · ~${f._avgPerSet||0} question${f._avgPerSet===1?'':'s'} each · ${f._count||0} total${!f.exam_type?' · not set up yet':''}`}</div>
          ${pct!=null ? `<div class="muted" style="font-size:12.5px;color:var(--amber);">Your score: ${pct}%${rank.rank?` · ${rank.percentile}ᵗʰ percentile (updates as more people attempt)`:' · not enough attempts yet to rank'}</div>` : ''}
        </div>`;
      });
    }
    const listArea = document.getElementById('folderListArea');
    if(!listArea) return;
    listArea.innerHTML = html;
    const sel = document.getElementById('folderGroupSel');
    if(sel) sel.onchange = (e)=>{ curFilterGroup = e.target.value; renderList(curFilterGroup, loading); };
    document.querySelectorAll('[data-folder]').forEach(el=>{
      el.onclick = async ()=>{
        const fid = el.dataset.folder;
        const { data: f } = await sb.from('folders').select('*').eq('id', fid).maybeSingle();
        if(!f.exam_type){ toast('Admin has not configured this section yet'); return; }
        goTo({nav:{...S.nav, folderId: fid}});
      };
    });
  }

  if(myToken !== navToken) return;
  document.getElementById('utabBody').innerHTML += `<div id="folderListArea"></div>`;
  // Show the list of section names right away — this is what the person is
  // actually here for — instead of leaving the screen blank while question
  // counts, subsection counts, and everyone's rank stats load underneath.
  // Those details fill themselves in a moment later without another tap.
  let curFilterGroup = '__all__';
  renderList(curFilterGroup, true);
  const crumb0 = document.querySelector('[data-crumb="0"]');
  if(crumb0) crumb0.onclick = ()=>{ goTo({nav:{}}); };
  const crumb1 = document.querySelector('[data-crumb="1"]');
  if(crumb1) crumb1.onclick = ()=>{ goTo({nav:{qbankId:S.nav.qbankId}}); };

  // One round trip for all folder counts in this category, instead of one
  // count query per folder — this was the main lag when opening a platform.
  const countMap = await countsByFolder(folders.map(f=>f.id));
  if(myToken !== navToken) return;
  folders.forEach(f=>{ f._count = countMap[f.id]||0; });
  renderList(curFilterGroup, false);

  // How many subsections ("sub-folders") each section splits into, and this
  // user's live score/percentile per section — both batched (one query +
  // one set of parallel RPC calls) instead of a query per folder. This is
  // the slowest part (a rank RPC per section), so it fills in last, after
  // the list and its question counts are already on screen.
  const { data: setRows } = await sb.from('sets').select('folder_id').is('user_id', null).eq('set_type','main').in('folder_id', folders.map(f=>f.id));
  if(myToken !== navToken) return;
  const setCountMap = {};
  (setRows||[]).forEach(r=>{ setCountMap[r.folder_id] = (setCountMap[r.folder_id]||0)+1; });
  folders.forEach(f=>{
    f._setCount = setCountMap[f.id]||0;
    f._avgPerSet = f._setCount ? Math.round((f._count||0)/f._setCount) : (f._count||0);
  });
  renderList(curFilterGroup, false);

  const rankResults = await Promise.all(folders.map(f=>sb.rpc('folder_rank_stats', { p_folder_id: f.id, p_user_id: S.profile.id })));
  if(myToken !== navToken) return;
  folders.forEach((f,i)=>{
    const r = rankResults[i]?.data; const row = Array.isArray(r)?r[0]:r;
    f._rank = (row && row.sets_completed) ? row : null;
  });
  renderList(curFilterGroup, false);
}
async function loadFolderSets(isActive){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const { data: qb } = await sb.from('qbanks').select('*').eq('id', S.nav.qbankId).maybeSingle();
  if(myToken !== navToken) return;
  const { data: folder } = await sb.from('folders').select('*').eq('id', S.nav.folderId).maybeSingle();
  if(myToken !== navToken) return;
  body.innerHTML += crumbBar([{label:'QBanks', onClick:true},{label:qb?.name||'QBank', onClick:true},{label:S.nav.category, onClick:true},{label: folder ? leafNameOf(folder.name) : 'Section'}]);
  document.querySelector('[data-crumb="0"]').onclick = ()=>{ goTo({nav:{}}); };
  document.querySelector('[data-crumb="1"]').onclick = ()=>{ goTo({nav:{qbankId:S.nav.qbankId}}); };
  document.querySelector('[data-crumb="2"]').onclick = ()=>{ goTo({nav:{qbankId:S.nav.qbankId, category:S.nav.category}}); };

  const { data: sets } = await sb.from('sets').select('*').eq('folder_id', folder.id).is('user_id', null).order('subject').order('set_number');
  if(myToken !== navToken) return;
  let html = '';
  if(!sets || !sets.length){ html = `<div class="card muted">No sets generated for this section yet.</div>`; document.getElementById('utabBody').innerHTML += html; return; }

  // Everything every set row needs (this user's latest attempt, and its
  // rank stats) is fetched up front in a small, fixed number of batched
  // round trips — instead of the old approach of awaiting several queries
  // PER set inside a sequential for-loop, which was the main reason a
  // section with many sets/subsections felt slow to open.
  const setIds = sets.map(s=>s.id);
  const { data: allAttempts } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('status','submitted').in('set_id', setIds).order('submitted_at', {ascending:false});
  if(myToken !== navToken) return;
  const attemptBySet = {};
  (allAttempts||[]).forEach(a=>{ if(!attemptBySet[a.set_id]) attemptBySet[a.set_id] = a; }); // first hit per set = latest, since ordered desc
  const attemptedIds = Object.keys(attemptBySet);
  const rankResults = await Promise.all(attemptedIds.map(sid=>sb.rpc('set_rank_stats', { p_set_id: sid, p_user_id: S.profile.id })));
  if(myToken !== navToken) return;
  const rankBySet = {};
  attemptedIds.forEach((sid,i)=>{ const r = rankResults[i].data; rankBySet[sid] = Array.isArray(r)?r[0]:r; });
  const byNum = {}; sets.forEach(s=>{ byNum[s.set_number] = s; });

  // For full-length sequential patterns (INICET / NEET PG / auto-subsection —
  // anything that isn't the subject-wise practice mode), show a one-time
  // instructions screen with a "Start Exam" button before the section's
  // sets are revealed, the first time this user opens it with nothing
  // attempted yet. Re-opening later (or once something's been attempted)
  // skips straight to the sets list as before.
  const cfg = EXAM_CONFIG[folder.exam_type];
  if(cfg && cfg.sequential && attemptedIds.length===0 && !(S.instructionsAcked && S.instructionsAcked[folder.id])){
    const totalQ = sets.reduce((n,s)=>n+(s.question_ids?.length||0),0);
    const totalMin = Math.round(sets.reduce((n,s)=>n+(s.duration_minutes||0),0));
    const setRowsHtml = sets.map(s=>`<div class="row" style="justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);">
        <span>Set ${s.set_number}</span><span class="muted">${(s.question_ids?.length||0)} questions · ${s.duration_minutes} min</span>
      </div>`).join('');
    document.getElementById('utabBody').innerHTML += `<div class="card">
      <h3>📋 Before you start — ${leafNameOf(folder.name)}</h3>
      <ul style="margin:10px 0; padding-left:20px; line-height:1.7;">
        <li>This section has <b>${totalQ} questions</b> split into <b>${sets.length} timed set${sets.length===1?'':'s'}</b>, totaling <b>${totalMin} minutes</b>.</li>
        <li>Each set has its <b>own timer</b>. When a set's timer runs out, it auto-submits with whatever you've answered so far.</li>
        <li>Sets must be done <b>in order</b> — a set unlocks only after you submit the one before it. You can't go back and reopen a submitted set.</li>
        <li>Don't refresh, close the tab, or switch apps mid-set — the timer keeps running in the background regardless.</li>
        <li>Attempt every question if you can; there's no going back once a set is submitted, so mark your best answer before time runs out.</li>
        <li>Once every set is submitted, you'll see your full report card — score, rank, and question-difficulty breakdown.</li>
      </ul>
      <div class="muted" style="font-size:12px;margin-top:14px;">Time per set</div>
      <div style="margin:6px 0 4px;">${setRowsHtml}</div>
      <div class="muted" style="font-size:12px;margin-top:14px;">Question palette colours (shown while you attempt)</div>
      <div class="legend" style="margin-top:6px;">
        <div><span style="background:var(--gray)"></span>Not visited</div>
        <div><span style="background:var(--red)"></span>Not answered</div>
        <div><span style="background:var(--green)"></span>Answered</div>
        <div><span style="background:var(--purple)"></span>Marked for review</div>
        <div><span style="background:var(--purple);box-shadow:inset 0 0 0 2px var(--green)"></span>Answered & marked</div>
      </div>
      <button class="primary" id="startExamBtn" style="margin-top:16px;">Start Exam</button>
    </div>`;
    document.getElementById('startExamBtn').onclick = ()=>{
      S.instructionsAcked = S.instructionsAcked || {};
      S.instructionsAcked[folder.id] = true;
      loadFolderSets(isActive);
    };
    return;
  }

  if(folder.exam_type==='subjectwise'){
    const bySubject={};
    sets.forEach(s=>{ (bySubject[s.subject||'General']=bySubject[s.subject||'General']||[]).push(s); });
    for(const subj in bySubject){
      if(myToken !== navToken) return;
      html += `<div class="muted" style="margin:10px 0 4px;font-weight:600;">${subj}</div>`;
      for(const s of bySubject[subj]) html += setRow(s, isActive, false, attemptBySet[s.id], rankBySet[s.id]);
    }
  } else {
    let allDone = true, anyDone = false;
    for(const s of sets){
      const prev = s.set_number>1 ? byNum[s.set_number-1] : null;
      const locked = EXAM_CONFIG[folder.exam_type].sequential && prev ? !attemptBySet[prev.id] : false;
      html += setRow(s, isActive, locked, attemptBySet[s.id], rankBySet[s.id]);
      if(attemptBySet[s.id]) anyDone = true; else allDone = false;
    }
    // Whole-section total: counts every subsection's score/correct/total
    // together in one go (not one set at a time), so you see the overall
    // percentage and where you rank against everyone else on this section,
    // as soon as you've submitted at least one subsection here. Once every
    // subsection is done, this becomes the full report card below.
    if(anyDone){
      const { data: fstats, error: fErr } = await sb.rpc('folder_rank_stats', { p_folder_id: folder.id, p_user_id: S.profile.id });
      if(myToken !== navToken) return;
      const frow = Array.isArray(fstats) ? fstats[0] : fstats;
      if(frow && frow.user_total){
        const fpct = Math.round((frow.user_correct/frow.user_total)*1000)/10;
        if(!allDone){
          html += `<div class="card" style="margin-top:14px;">
            <h3>Section total so far (${frow.sets_completed}/${frow.sets_total} subsections)</h3>
            <div class="muted">✅ ${frow.user_correct}/${frow.user_total} correct (${fpct}%) · score ${frow.user_score>0?'+':''}${frow.user_score}</div>
            <div class="muted" style="margin-top:4px;">${frow.rank ? `Rank ${frow.rank}/${frow.total_attempts} · ${frow.percentile}ᵗʰ percentile` : 'Not enough other users\' totals yet to rank against.'}</div>
          </div>`;
        } else {
          // Full report card — only built once, right when the section is
          // finished, since it needs one extra (batched, single) query for
          // every question's community accuracy to classify tough/easy.
          const allQIds = [...new Set(sets.flatMap(s=>s.question_ids||[]))];
          const { data: accStats } = await sb.rpc('question_accuracy_stats', { p_question_ids: allQIds });
          if(myToken !== navToken) return;
          let hard=0, med=0, easy=0;
          (accStats||[]).forEach(s=>{
            if(!s.total_attempts) return;
            const acc = s.correct_attempts / s.total_attempts;
            if(acc<=0.4) hard++; else if(acc<=0.7) med++; else easy++;
          });
          const maxCount = Math.max(hard, med, easy, 1);
          html += `<div class="card reportcard" style="margin-top:16px;">
            <h2>📋 Section report card</h2>
            <div class="muted" style="margin-bottom:16px;">${folder.name} · all ${frow.sets_total} subsections complete</div>
            <div class="row" style="align-items:center;gap:26px;flex-wrap:wrap;">
              <div class="donut" style="--pct:${fpct}"><span>${fpct}%</span></div>
              <div>
                <div style="font-size:16px;"><b>${frow.user_correct}/${frow.user_total}</b> correct</div>
                <div class="muted" style="margin-top:2px;">Score: ${frow.user_score>0?'+':''}${frow.user_score}</div>
                <div class="muted" style="margin-top:2px;">${frow.rank ? `Rank ${frow.rank}/${frow.total_attempts} · ${frow.percentile}ᵗʰ percentile — updates as more people attempt` : 'Not enough other users\' totals yet to rank against.'}</div>
              </div>
            </div>
            <div style="margin-top:24px;">

      } else if(fErr){

    if(allDone && sets.length){

function setRow(s, isActive, locked=false, att=null, rankRow=null){
  const n = s.question_ids.length;
  let statsHtml = '';
  if(att){
    const row = rankRow;
    // Percentage is always computed straight from this attempt's own
    // correct/total — it no longer depends on the rank RPC returning data,
    // so it still shows even when there's only one attempt so far (no one
    // to rank/percentile against yet).
    const totalQ = att.total_questions ?? n;
    const pct = totalQ ? Math.round((att.correct_count||0)/totalQ*1000)/10 : null;
    statsHtml = `<div class="muted" style="font-size:12px;margin-top:3px;">
      ✅ ${att.correct_count ?? '—'}/${totalQ} correct (${pct!=null?pct+'%':'—'}) · score ${att.score>0?'+':''}${att.score}
      ${row && row.rank ? ` · rank ${row.rank}/${row.total_attempts} · ${row.percentile}ᵗʰ percentile` : ' · percentile: not enough attempts yet to compare'}
    </div>`;
  }
  return `<div class="qrow" style="flex-direction:column;align-items:stretch;gap:6px;cursor:default;">
    <div class="row" style="justify-content:space-between;">
      <div><b>Set ${s.set_number}</b> · ${n} questions · ${s.duration_minutes} min ${locked?'<span class="lockicon">🔒</span>':''}</div>
      <div class="row" style="gap:8px;">
        ${att?`<button class="subtle" data-reviewset="${s.id}">Review</button>`:''}
        ${att?`<button class="subtle" data-resetset="${s.id}" title="Wipe every attempt for this set and start completely fresh">Reset</button>`:''}
        <button class="${isActive&&!locked?'primary':'ghost'}" data-startset="${s.id}" ${(!isActive||locked)?'disabled':''}>${!isActive?'Locked':locked?'Complete previous':att?'Retake':'Start'}</button>
      </div>
    </div>
    ${statsHtml}
  </div>`;
}
function wireSetRows(){
  document.querySelectorAll('[data-startset]').forEach(b=>{
    b.onclick = ()=> startAttempt(b.dataset.startset);
  });
  document.querySelectorAll('[data-reviewset]').forEach(b=>{
    b.onclick = ()=> openReviewForSet(b.dataset.reviewset);
  });
  document.querySelectorAll('[data-resetset]').forEach(b=>{
    b.onclick = async ()=>{
      if(!confirm('Reset this set? Every past attempt, score, and answer for it will be permanently deleted — this cannot be undone.')) return;
      b.disabled = true; b.textContent = 'Resetting…';
      const setId = b.dataset.resetset;
      const { error } = await sb.from('attempts').delete().eq('user_id', S.profile.id).eq('set_id', setId);
      if(error){ alert('Reset failed: ' + error.message); b.disabled = false; b.textContent = 'Reset'; return; }
      loadFolderSets(true);
    };
  });
}
async function openReviewForSet(setId){
  const { data: s } = await sb.from('sets').select('*').eq('id', setId).maybeSingle();
  const { data: att } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('set_id', setId).eq('status','submitted').order('submitted_at',{ascending:false}).limit(1).maybeSingle();
  if(!s || !att){ toast('No completed attempt to review yet'); return; }
  // Same reasoning as startAttempt: skip the (possibly large, embedded-base64)
  // image_url in this bulk fetch so review opens quickly; images are loaded
  // lazily per-question as you page through (see ensureQuestionImage).
  const { data: qs } = await sb.from('questions').select('id, q_text, options, correct_index, explanation, subject').in('id', s.question_ids);
  const questions = s.question_ids.map(id=>qs.find(q=>q.id===id)).filter(Boolean);
  // Community accuracy per question, fetched once for the whole set (not
  // per question) so paging through review stays instant.
  const { data: accStats } = await sb.rpc('question_accuracy_stats', { p_question_ids: questions.map(q=>q.id) });
  const accById = {}; (accStats||[]).forEach(a=>{ accById[a.question_id]=a; });
  questions.forEach(q=>{ q._acc = accById[q.id] || null; });
  goTo({ review:{ att, set: s, questions, showExpl:false } });
}
async function loadFullTestReview(folderId){
  const { data: sets } = await sb.from('sets').select('*').eq('folder_id', folderId).is('user_id', null).eq('set_type','main').order('set_number');
  let allQuestions = [], mergedAnswers = {}, totalScore = 0, totalCorrect = 0, totalQ = 0;
  for(const s of sets){
    const { data: att } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('set_id', s.id).eq('status','submitted').order('submitted_at',{ascending:false}).limit(1).maybeSingle();
    if(!att){ toast('Complete every section first'); return; }
    const { data: qs } = await sb.from('questions').select('id, q_text, options, correct_index, explanation, subject').in('id', s.question_ids);
    const ordered = s.question_ids.map(id=>qs.find(q=>q.id===id)).filter(Boolean);
    allQuestions = allQuestions.concat(ordered);
    Object.assign(mergedAnswers, att.answers);
    totalScore += (att.score||0); totalCorrect += (att.correct_count||0); totalQ += (att.total_questions||ordered.length);
  }
  const fakeAtt = { id:null, answers: mergedAnswers, score: totalScore, correct_count: totalCorrect, total_questions: totalQ };
  const { data: accStats } = await sb.rpc('question_accuracy_stats', { p_question_ids: allQuestions.map(q=>q.id) });
  const accById = {}; (accStats||[]).forEach(a=>{ accById[a.question_id]=a; });
  allQuestions.forEach(q=>{ q._acc = accById[q.id] || null; });
  goTo({ review:{ att: fakeAtt, set: {question_ids: allQuestions.map(q=>q.id)}, questions: allQuestions, showExpl:false } });
}

async function loadStatsTab(){
  const myToken = navToken;
  const body=document.getElementById('utabBody');
  body.innerHTML = '';
  const start = new Date(); start.setHours(0,0,0,0);
  const weekStart = new Date(start); weekStart.setDate(weekStart.getDate()-6);

  // One query covers both "today" and the 7-day daily breakdown, using the
  // correct_count/total_questions already stored on each attempt at submit
  // time — no more per-attempt "look up every question again" loop, which
  // was what made this tab slow to open.
  const [{ data: weekAttempts }, pctRes] = await Promise.all([
    sb.from('attempts').select('correct_count, total_questions, submitted_at')
      .eq('user_id', S.profile.id).eq('status','submitted').gte('submitted_at', weekStart.toISOString()),
    sb.rpc('get_today_percentile'),
  ]);
  if(myToken !== navToken) return;
  const pct = pctRes.data && pctRes.data[0];

  const todayKey = start.toLocaleDateString('en-CA');
  const byDay = {};
  (weekAttempts||[]).forEach(a=>{
    const key = new Date(a.submitted_at).toLocaleDateString('en-CA');
    byDay[key] = byDay[key] || {attempted:0, correct:0};
    byDay[key].attempted += (a.total_questions||0);
    byDay[key].correct += (a.correct_count||0);
  });
  const today = byDay[todayKey] || {attempted:0, correct:0};
  const total = today.attempted, corrCount = today.correct, wrongCount = total - corrCount;

  const days = Object.keys(byDay).sort().reverse();
  let dailyHtml = `<div class="card"><h3>Daily stats (last 7 days)</h3>`;
  if(days.length){
    dailyHtml += days.map(d=>{
      const {attempted, correct} = byDay[d];
      const acc = attempted ? Math.round(correct/attempted*100) : 0;
      const label = d===todayKey ? 'Today' : new Date(d+'T00:00:00').toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
      return `<div class="qrow" style="cursor:default;"><div><b>${label}</b> · ${attempted} q attempted</div><div class="muted">${correct}/${attempted||1} correct (${acc}%)</div></div>`;
    }).join('');
  } else {
    dailyHtml += `<div class="muted">No attempts in the last 7 days yet — this fills in as you complete sets.</div>`;
  }
  dailyHtml += `</div>`;

  if(myToken !== navToken) return;
  const havePct = pct && pct.percentile != null;
  const gaugeHtml = havePct ? `<div class="card" style="text-align:center;">
      <div class="muted" style="font-size:12px;letter-spacing:.03em;">HOW YOU'RE DOING TODAY</div>
      <div style="max-width:220px;margin:6px auto -18px;"><canvas id="pctGauge"></canvas></div>
      <div style="font-size:30px;font-weight:800;color:var(--amber);margin-top:4px;">${pct.percentile}<span style="font-size:16px;">th percentile</span></div>
      <div class="muted" style="margin-top:4px;">Better than ${pct.percentile}% of ${pct.users_compared} user${pct.users_compared===1?'':'s'} active today · your accuracy: ${Math.round(pct.my_accuracy)}%</div>
    </div>`
    : `<div class="card muted" style="text-align:center;">${total>0 ? 'Not enough other users active today yet to compare against.' : 'Attempt some questions today to see your percentile here.'}</div>`;

  document.getElementById('utabBody').innerHTML += gaugeHtml + `<div class="card"><h3>Today</h3>
    <div class="row" style="gap:26px;align-items:center;flex-wrap:wrap;">
      <div class="row" style="gap:26px;">
        <div><div class="stat-big">${total}</div><div class="muted">Attempted</div></div>
        <div><div class="stat-big" style="color:var(--green)">${corrCount}</div><div class="muted">Correct</div></div>
        <div><div class="stat-big" style="color:var(--red)">${wrongCount}</div><div class="muted">Wrong</div></div>
      </div>
      <div style="width:130px;height:130px;flex-shrink:0;">${total>0?'<canvas id="todayPieChart"></canvas>':''}</div>
    </div>
  </div>
  ${dailyHtml}
  <div class="card"><h3>Accuracy trend (last 7 days)</h3>
    <div style="height:200px;">${days.length?'<canvas id="accLineChart"></canvas>':'<div class="muted">No attempts in the last 7 days yet.</div>'}</div>
  </div>
  <div class="card"><h3>Questions per day</h3>
    <div style="height:220px;">${days.length?'<canvas id="weekBarChart"></canvas>':'<div class="muted">No attempts in the last 7 days yet.</div>'}</div>
  </div>`;

  // Chart.js instances get torn down and rebuilt every time this tab loads
  // (S._charts keeps the references) — otherwise re-opening the tab throws
  // "canvas already in use" since the old chart is still attached.
  S._charts = S._charts || {};
  Object.values(S._charts).forEach(c=>c?.destroy?.());
  S._charts = {};
  if(havePct){
    const ctx0 = document.getElementById('pctGauge');
    if(ctx0) S._charts.gauge = new Chart(ctx0, {
      type: 'doughnut',
      data: { datasets:[{ data:[pct.percentile, 100-pct.percentile], backgroundColor:['#efa53e','rgba(255,255,255,.08)'], borderWidth:0 }] },
      options: { rotation:-90, circumference:180, cutout:'75%', plugins:{ legend:{display:false}, tooltip:{enabled:false} } }
    });
  }
  if(total>0){
    const ctx = document.getElementById('todayPieChart');
    if(ctx) S._charts.today = new Chart(ctx, {
      type: 'doughnut',
      data: { labels:['Correct','Wrong'], datasets:[{ data:[corrCount, wrongCount], backgroundColor:['#30b87a','#f0525a'], borderColor:'#0e0e18', borderWidth:2 }] },
      options: { plugins:{ legend:{display:false} }, cutout:'68%' }
    });
  }
  if(days.length){
    const labels = days.slice().reverse().map(d=> d===todayKey ? 'Today' : new Date(d+'T00:00:00').toLocaleDateString('en-IN',{weekday:'short'}));
    const attemptedArr = days.slice().reverse().map(d=>byDay[d].attempted);
    const correctArr = days.slice().reverse().map(d=>byDay[d].correct);
    const accArr = days.slice().reverse().map(d=> byDay[d].attempted ? Math.round(byDay[d].correct/byDay[d].attempted*100) : 0);
    const ctxAcc = document.getElementById('accLineChart');
    if(ctxAcc) S._charts.acc = new Chart(ctxAcc, {
      type: 'line',
      data: { labels, datasets:[{ label:'Accuracy %', data:accArr, borderColor:'#efa53e', backgroundColor:'rgba(239,165,62,.18)', fill:true, tension:.35, pointBackgroundColor:'#efa53e', pointRadius:4 }] },
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{display:false} },
        scales:{
          x:{ ticks:{ color:'#9698b0' }, grid:{ color:'rgba(255,255,255,.06)' } },
          y:{ ticks:{ color:'#9698b0', callback:v=>v+'%' }, grid:{ color:'rgba(255,255,255,.06)' }, beginAtZero:true, max:100 }
        }
      }
    });
    const ctx2 = document.getElementById('weekBarChart');
    if(ctx2) S._charts.week = new Chart(ctx2, {
      type: 'bar',
      data: { labels, datasets:[
        { label:'Attempted', data:attemptedArr, backgroundColor:'#efa53e', borderRadius:6 },
        { label:'Correct', data:correctArr, backgroundColor:'#30b87a', borderRadius:6 },
      ]},
      options: { responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ labels:{ color:'#c9cbe0' } } },
        scales:{
          x:{ ticks:{ color:'#9698b0' }, grid:{ color:'rgba(255,255,255,.06)' } },
          y:{ ticks:{ color:'#9698b0' }, grid:{ color:'rgba(255,255,255,.06)' }, beginAtZero:true }
        }
      }
    });
  }
}

async function loadDecksTab(){

  cats.forEach(c=>{ const fid=c.questions.folder_id; byFolder[fid]=byFolder[fid]||{}; (byFolder[fid][c.category]=byFolder[fid][c.category]||[]).push(c.question_id); });
  // Batch-fetch every folder name in one round trip instead of one query

  const fids = Object.keys(byFolder);

async function startCategoryDeck(folderId, category){
  const { data: cats } = await sb.from('categorizations').select('question_id, questions!inner(folder_id, qbank_id)').eq('user_id', S.profile.id).eq('category', category).eq('questions.folder_id', folderId);

  const qbankId = cats[0]?.questions?.qbank_id;
  const dur = Math.round(ids.length*0.9*10)/10;
  const { data: existing } = await sb.from('sets').select('*').eq('folder_id', folderId).eq('user_id', S.profile.id).eq('category', category).maybeSingle();
  let setRowData = existing;
  if(existing){
    const upd = await sb.from('sets').update({question_ids:ids, duration_minutes:dur}).eq('id', existing.id).select().maybeSingle();

}

      ${rows.map(r=>`<tr class="${r.is_me?'me':''}"><td>${r.rnk}</td><td>${escapeHtml(r.name||'—')}</td><td>${r.correct_count}/${r.total_questions}</td><td>${r.score>0?'+':''}${r.score}</td></tr>`).join('')}
    </table></div>`;
  }
  body.innerHTML = html;
}

async function buildCustomSet(){
  const st = document.getElementById('ctStatus');
  const resultEl = document.getElementById('ctResult');
  resultEl.innerHTML = '';
  st.textContent = 'Building your set…';
  const qbankId = document.getElementById('ctPlatform').value;
  const source = document.getElementById('ctSource').value;
  const difficulty = document.getElementById('ctDifficulty').value;
  const category = document.getElementById('ctCategory').value;

  const folders = await fetchAllRows(()=> qbankId==='__all__'
    ? sb.from('folders').select('id, name, exam_type, qbank_id')
    : sb.from('folders').select('id, name, exam_type, qbank_id').eq('qbank_id', qbankId));
  if(!folders || !folders.length){ st.textContent = 'No sections in this platform yet.'; return; }

  let targetFolders;
  if(source==='all') targetFolders = folders;
  else if(source==='subjectwise') targetFolders = folders.filter(f=>f.exam_type==='subjectwise');
  else targetFolders = folders.filter(f=> folderGroupOf(f.name).toLowerCase().startsWith(source));
  if(!targetFolders.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  const qRows = await fetchAllRows(()=>sb.from('questions').select('id').in('folder_id', targetFolders.map(f=>f.id)));
  let candidateIds = qRows.map(q=>q.id);
  if(!candidateIds.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  // Mistake-category filter, scoped to this user's own tags only.
  if(category !== 'all'){
    const { data: myCats } = await sb.from('categorizations').select('question_id, category').eq('user_id', S.profile.id).in('question_id', candidateIds);
    const tagged = new Set((myCats||[]).map(c=>c.question_id));
    if(category==='none'){
      candidateIds = candidateIds.filter(id=>!tagged.has(id));
    } else {
      const withThisTag = new Set((myCats||[]).filter(c=>c.category===category).map(c=>c.question_id));
      candidateIds = candidateIds.filter(id=>withThisTag.has(id));
    }
  }
  if(!candidateIds.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  // Never repeat a question from a previous custom set built with this exact
  // same combination of filters (tracked via custom_filter_key on our own
  // past 'custom' sets — see the Supabase notes for why this needs no extra
  // tracking table).
  const filterKey = `${qbankId}|${source}|${difficulty}|${category}`;
  const { data: pastSets } = await sb.from('sets').select('question_ids').eq('user_id', S.profile.id).eq('set_type','custom').eq('custom_filter_key', filterKey);
  const usedBefore = new Set();
  (pastSets||[]).forEach(s=> (s.question_ids||[]).forEach(id=>usedBefore.add(id)));
  candidateIds = candidateIds.filter(id=>!usedBefore.has(id));
  if(!candidateIds.length){ alert('No questions available — you\'ve already used every question that matches this combination.'); st.textContent=''; return; }

  // Difficulty filter needs community-wide accuracy, which RLS keeps a
  // regular user from querying directly — routed through a SECURITY DEFINER
  // RPC (question_accuracy_stats) that only returns aggregate counts.
  if(difficulty !== 'all'){
    const { data: stats, error: statErr } = await sb.rpc('question_accuracy_stats', { p_question_ids: candidateIds });
    if(statErr){ st.textContent = 'Could not load difficulty stats: ' + statErr.message; return; }
    const byId = {}; (stats||[]).forEach(s=> byId[s.question_id]=s);
    candidateIds = candidateIds.filter(id=>{
      const s = byId[id];
      if(!s || !s.total_attempts) return false; // no data yet -> can't classify, excluded from Easy/Medium/Hard
      const acc = s.correct_attempts / s.total_attempts;
      if(difficulty==='hard') return acc <= 0.4;
      if(difficulty==='medium') return acc > 0.4 && acc <= 0.7;
      if(difficulty==='easy') return acc > 0.7;
      return true;
    });
  }
  if(!candidateIds.length){ alert('No questions available for this combination.'); st.textContent=''; return; }

  // Shuffle and take up to 50; fewer than 50 just means a shorter set at the
  // same 0.9 min/question rate the folder auto-split already uses.
  for(let i=candidateIds.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [candidateIds[i],candidateIds[j]]=[candidateIds[j],candidateIds[i]]; }
  const picked = candidateIds.slice(0, 50);
  const duration = picked.length===50 ? 45 : Math.round(picked.length*0.9*10)/10;

  const sourceLabel = {all:'All', subjectwise:'Subject-wise', pyq:'PYQ', gt:'GT'}[source];
  const diffLabel = {all:'All', hard:'Hard', medium:'Medium', easy:'Easy'}[difficulty];
  const catLabel = category==='all' ? 'All' : category==='none' ? 'None' : CATS.find(c=>c.key===category)?.label;
  const platformLabel = qbankId==='__all__' ? 'All platforms' : document.getElementById('ctPlatform').selectedOptions[0].textContent;
  const label = `Custom: ${platformLabel} · ${sourceLabel} · ${diffLabel} · ${catLabel}`;

  const ins = await sb.from('sets').insert({
    qbank_id: qbankId==='__all__' ? null : qbankId, folder_id: null, user_id: S.profile.id, set_type:'custom',
    subject: label, custom_filter_key: filterKey,
    question_ids: picked, duration_minutes: duration, set_number: 1
  }).select().maybeSingle();
  if(ins.error){ st.textContent = 'Could not create set: ' + ins.error.message; return; }

  st.textContent = '';
  resultEl.innerHTML = `<div class="qrow" style="cursor:default;">
    <div><b>${picked.length} questions</b> · ${duration} min</div>
    <div class="row"><button class="primary" id="ctStart">Start now</button><button class="subtle" id="ctShare">Get share code</button></div>
  </div><div id="ctShareOut" class="muted" style="margin-top:8px;"></div>`;
  document.getElementById('ctStart').onclick = ()=> startAttempt(ins.data.id, ins.data);
  document.getElementById('ctShare').onclick = async ()=>{
    const code = await ensureShareCode(ins.data.id);
    document.getElementById('ctShareOut').innerHTML = code
      ? `Share this code: <b style="font-family:var(--mono);font-size:16px;letter-spacing:.08em;">${code}</b>`
      : 'Could not generate a code — try again.';
    loadMyCustomSets();
  };
  loadMyCustomSets();
}

async function ensureShareCode(setId){
  // Retries on the rare chance of a code collision (share_code is UNIQUE).
  for(let attempt=0; attempt<5; attempt++){
    const code = Array.from({length:6}, ()=> '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*32)]).join('');
    const upd = await sb.from('sets').update({share_code:code}).eq('id', setId).select().maybeSingle();
    if(!upd.error) return upd.data.share_code;
  }
  return null;
}

async function redeemShareCode(){
  const st = document.getElementById('ctRedeemStatus');
  const code = document.getElementById('ctCode').value.trim().toUpperCase();
  if(!code){ st.textContent = 'Type a code first.'; return; }

  const row = Array.isArray(data) ? data[0] : data;
  if(error || !row){ st.textContent = 'Code not found.'; return; }
  st.textContent = '';
  startAttempt(row.id, row);
}

// ================= EXAM PLAYER =================
async function startAttempt(setId, presetSet){
  const set = presetSet || (await sb.from('sets').select('*').eq('id', setId).maybeSingle()).data;
  let { data: att } = await sb.from('attempts').select('*').eq('user_id', S.profile.id).eq('set_id', setId).eq('status','in_progress').maybeSingle();
  // Deliberately excludes image_url: some questions now carry embedded
  // base64 images (can be several hundred KB each), and pulling that for
  // every question in the set up front is what was making a set take so
  // long to open. Text loads instantly; each question's image is fetched
  // lazily (see ensureQuestionImage) only once you're actually viewing it.
  const { data: questions } = await sb.from('questions')
    .select('id, q_text, options, correct_index, explanation, subject')
    .in('id', set.question_ids);
  const ordered = set.question_ids.map(id=>questions.find(q=>q.id===id)).filter(Boolean);
  if(!att){
    const initAnswers={}; ordered.forEach(q=>initAnswers[q.id]={selected:null,status:'not_visited'});
    const ins = await sb.from('attempts').insert({user_id:S.profile.id, set_id:setId, answers:initAnswers}).select().maybeSingle();
    att = ins.data;
  }
  const elapsedSec = Math.floor((Date.now()-new Date(att.started_at).getTime())/1000);
  const totalSec = Math.round(set.duration_minutes*60);
  if(elapsedSec >= totalSec){ await submitAttempt(att, set, ordered, true); return; }
  goTo({ exam:{ set, att, questions:ordered, idx:0, totalSec, elapsedAtLoad:elapsedSec }, view:'exam' });
  startTimer();
}
// Fetches a single question's image_url on demand (undefined = not fetched
// yet, null = fetched and confirmed there isn't one). Calls onLoaded() once
// it arrives so the caller can re-render if the user is still looking at
// this exact question — used from both the exam player and review screens.
function ensureQuestionImage(q, onLoaded){
  if(q.image_url !== undefined || q._imgFetching) return;
  q._imgFetching = true;
  sb.from('questions').select('image_url').eq('id', q.id).maybeSingle().then(({data})=>{
    q.image_url = data ? data.image_url : null;
    q._imgFetching = false;
    if(onLoaded) onLoaded();
  });
}
let timerHandle=null;
function startTimer(){
  clearInterval(timerHandle);
  const t0 = Date.now();
  timerHandle = setInterval(()=>{
    const elapsed = S.exam.elapsedAtLoad + Math.floor((Date.now()-t0)/1000);
    const remain = S.exam.totalSec - elapsed;
    const el = document.getElementById('examTimer');
    if(el) el.textContent = fmtTime(remain);
    const ring = document.getElementById('examTimerRing');
    if(ring){
      const pct = Math.max(0, Math.min(100, (remain/S.exam.totalSec)*100));
      ring.style.setProperty('--pct', pct);
      ring.classList.toggle('low', remain<=300);
    }
    if(remain<=0){ clearInterval(timerHandle); submitAttempt(S.exam.att, S.exam.set, S.exam.questions, true); }
  },1000);
}

  document.getElementById('markQ').onclick=()=>{ const a=att.answers[q.id]; if(['marked','answered_marked'].includes(a.status)){ a.status = a.selected!=null?'answered':'not_answered'; } else { a.status = a.selected!=null?'answered_marked':'marked'; } saveAttemptSoft(); renderExam(); };

    if(confirm('Submit this set now? You cannot resume it after submission.')) submitAttempt(att,set,questions,false);
  };
  document.getElementById('exitExamBtn').onclick=()=>{
    saveAttemptSoft();
    // Go through the same path as the phone's back button/gesture, so both
    // land on exactly the same previous screen (the set list) instead of

    history.back();

function renderOpts(){

let saveTimeout=null;
function saveAttemptSoft(){
  clearTimeout(saveTimeout);
  saveTimeout=setTimeout(async ()=>{
    await sb.from('attempts').update({answers:S.exam.att.answers}).eq('id', S.exam.att.id);

async function submitAttempt(att, set, questions, auto){
  clearInterval(timerHandle);
  const { data: qs } = await sb.from('questions').select('id, correct_index').in('id', set.question_ids);
  let score=0, correctCount=0;
  for(const q of qs){
    const a=att.answers[q.id];
    if(a && (a.status==='answered'||a.status==='answered_marked')){
      if(a.selected===q.correct_index){ score+=4; correctCount++; } else { score-=1; }
    }
  }
  await sb.from('attempts').update({answers:att.answers, status:'submitted', submitted_at:new Date().toISOString(), score, correct_count:correctCount, total_questions:qs.length}).eq('id', att.id);
  att.status='submitted'; att.score=score;
  toast(auto? 'Time up — set auto-submitted' : 'Set submitted');
  S.exam = null;
  S.review = { att, set, questions, showExpl:false };
  renderReviewChoice();
}

  const { data: existingCat } = await sb.from('categorizations').select('category').eq('user_id', S.profile.id).eq('question_id', q.id).maybeSingle();

  const accBar = `<div class="row" style="align-items:center;gap:10px;margin-bottom:10px;">

    </div>
  </div>`;
  app.innerHTML = `<div class="topbar"><div class="brand"><span class="dot"></span>Review ${i+1}/${questions.length} ${wrongOnly?'· wrong only':''}</div><button class="ghost" id="closeRev" style="padding:8px 12px;font-size:12px;">Close</button></div>
  <div class="container">
    <div class="reviewcard" id="revCapture">
      <div class="qmeta">Question ${i+1}</div>

      ${withExpl?`<div class="divider"></div><div><b>Explanation</b>${renderRichText(q.explanation||'No explanation provided.')}</div>`:''}
    </div>
    ${withExpl?`<div class="row"><button class="subtle" id="ssWith">📸 Save screenshot (with explanation)</button><button class="subtle" id="ssWithout">📸 Save screenshot (without explanation)</button></div>`
      :`<div class="card"><div class="muted" style="margin-bottom:6px;">Why did this go wrong?</div><div class="catbtns" id="catbtns"></div></div>`}
    <div class="row" style="margin-top:14px;"><button class="ghost" id="pv" ${i===0?'disabled':''}>◀ Prev</button><button class="primary" id="nx" ${i===questions.length-1?'disabled':''}>Next ▶</button></div>
  </div>`;
  const optsEl=document.getElementById('revOpts');
  optsEl.innerHTML = q.options.map((o,idx)=>{
    let cls='';
    if(idx===q.correct_index) cls='correct';
    else if(a.selected===idx) cls='wrong';
    return `<div class="opt ${cls}">${renderRichText(o)}</div>`;
  }).join('');
  document.getElementById('closeRev').onclick=()=>{ history.back(); };
  document.getElementById('pv').onclick=()=>renderReview(withExpl, i-1, wrongOnly);
  document.getElementById('nx').onclick=()=>renderReview(withExpl, i+1, wrongOnly);
  if(!withExpl){
    const cb=document.getElementById('catbtns');
    cb.innerHTML = CATS.map(c=>`<button class="${existingCat?.category===c.key?'primary':'subtle'}" data-c="${c.key}">${c.label}</button>`).join('');
    cb.querySelectorAll('button').forEach(b=>b.onclick=async ()=>{
      await sb.from('categorizations').upsert({user_id:S.profile.id, question_id:q.id, category:b.dataset.c}, {onConflict:'user_id,question_id'});
      toast('Tagged: '+b.textContent);
      renderReview(withExpl,i,wrongOnly);
    });
  } else {
    document.getElementById('ssWith').onclick=()=>captureShot(true);
    document.getElementById('ssWithout').onclick=()=>captureShot(false);
  }
}
async function captureShot(withExpl){
  const node=document.getElementById('revCapture');
  const explDiv = node.querySelector('.divider')?.nextElementSibling;
  const dividerEl = node.querySelector('.divider');
  let hid=false;
  if(!withExpl && dividerEl){ dividerEl.style.display='none'; if(explDiv) explDiv.style.display='none'; hid=true; }
  let canvas;
  try{
    canvas = await html2canvas(node, {backgroundColor:'#141B2E', useCORS:true, imageTimeout:15000});
  }catch(err){
    // Cross-origin question images without permissive CORS headers can
    // "taint" the canvas and make html2canvas throw when it tries to read
    // pixel data back out. Fall back to a version without useCORS so the
    // rest of the screenshot (text, options) still gets saved rather than
    // failing completely.
    try{
      canvas = await html2canvas(node, {backgroundColor:'#141B2E'});
      toast('Saved, but the image couldn\'t be captured (host doesn\'t allow it)');
    }catch(err2){
      if(hid){ dividerEl.style.display=''; if(explDiv) explDiv.style.display=''; }
      toast('Screenshot failed — try again');
      return;
    }
  }
  if(hid){ dividerEl.style.display=''; if(explDiv) explDiv.style.display=''; }
  const link=document.createElement('a');
  link.download = 'question_'+Date.now()+'.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
  toast('Image saved to downloads');
}

function prettifyName(filename){
  let n = filename.replace(/\.(ndjson|json|txt)$/i,'');
  n = n.replace(/[_-]+/g,' ').trim();
  return n.replace(/\w\S*/g, w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase());
}

    <label>Images (optional) — select every image file your JSON refers to by filename</label>

    <button class="primary" id="qbUpload" style="margin-top:14px;">Parse & upload</button>
